<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="860" height="340" rx="14" fill="#15171c"/>
  <text x="28" y="40" fill="#e8eaed" font-size="19" font-weight="700">Arm, wait, run</text>
  <text x="28" y="62" fill="#9aa0a6" font-size="13">A payload never fires just because the app opens. It runs only after Start or Arm.</text>

  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- IDLE -->
  <rect x="40" y="130" width="140" height="70" rx="35" fill="#1f2228" stroke="#3a3f47"/>
  <text x="110" y="162" fill="#e8eaed" font-size="15" font-weight="700" text-anchor="middle">IDLE</text>
  <text x="110" y="182" fill="#9aa0a6" font-size="12" text-anchor="middle">app open</text>

  <!-- ARMED -->
  <rect x="300" y="130" width="160" height="70" rx="12" fill="#241a1e" stroke="#FF2D55"/>
  <text x="380" y="162" fill="#ff6a8a" font-size="15" font-weight="700" text-anchor="middle">ARMED</text>
  <text x="380" y="182" fill="#9aa0a6" font-size="12" text-anchor="middle">waits for a PC</text>

  <!-- RUNNING -->
  <rect x="580" y="130" width="160" height="70" rx="12" fill="#1f2228" stroke="#3a3f47"/>
  <text x="660" y="162" fill="#e8eaed" font-size="15" font-weight="700" text-anchor="middle">RUNNING</text>
  <text x="660" y="182" fill="#9aa0a6" font-size="12" text-anchor="middle">typing payload</text>

  <!-- arrows -->
  <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#b)">
    <line x1="180" y1="165" x2="296" y2="165"/>
    <line x1="460" y1="165" x2="576" y2="165"/>
  </g>
  <text x="238" y="156" fill="#9aa0a6" font-size="12" text-anchor="middle">Start / Arm</text>
  <text x="518" y="156" fill="#9aa0a6" font-size="12" text-anchor="middle">PC takes</text>
  <text x="518" y="172" fill="#9aa0a6" font-size="12" text-anchor="middle">the keyboard</text>

  <!-- after: rearm / chain loop back -->
  <path d="M660,200 C660,260 380,268 380,206" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#b)"/>
  <text x="520" y="262" fill="#9aa0a6" font-size="12" text-anchor="middle">after rearm / chain</text>

  <!-- timeout disarm back to idle -->
  <path d="M300,190 C210,236 150,232 110,204" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="196" y="236" fill="#9aa0a6" font-size="12" text-anchor="middle">timeout / Stop</text>

  <!-- after stop -->
  <path d="M660,200 C660,300 150,300 110,204" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="390" y="320" fill="#9aa0a6" font-size="12" text-anchor="middle">after stop</text>
</svg>
